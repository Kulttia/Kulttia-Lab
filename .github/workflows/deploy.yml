name: 🚀 Deploy Kulttia Lab → Hostinger

on:
  push:
    branches:
      - main
  # Kulttia Studio lo dispara al publicar o programar-que-sale un artículo (workflow_dispatch con el token
  # KULTTIA_SITE_DISPATCH_TOKEN, fine-grained solo para este repo, Actions: Read and write).
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo (p. ej. blog:<slug>)'
        required: false
        default: 'manual'
  # Alternativa con repository_dispatch (event_type wp-post-published), por si se usa un token con Contents: write.
  repository_dispatch:
    types: [wp-post-published]

# Un despliegue a la vez; si llegan varios seguidos, gana el último (lee el CMS en ese momento).
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ✅ Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Páginas estáticas de los artículos (blog/<slug>/index.html) y sitemap.xml desde el API del CMS.
      # No usa dependencias (solo fetch de Node). Si el CMS no responde, el despliegue sigue con las páginas del repo.
      - name: 📰 Generar artículos desde el CMS
        run: node build-articles.mjs || echo "::warning::No se pudieron regenerar los artículos; se despliegan los del repositorio."

      - name: 📤 Deploy a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.kulttia.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /public_html/
          local-dir: ./
          security: loose
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            fix-footer.js
            fix-flash.js
            fix-hrefs.ps1
            update.js
            README.md
            test.json
            *.log
            *.tmp
